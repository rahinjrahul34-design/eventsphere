name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  server-tests:
    name: Server tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Run server test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Publish Jest summary
        if: always()
        run: |
          echo "=== Jest summary ==="
          grep -E "^(Test Suites|Tests|Snapshots|Time):" test-output.log || echo "no summary found"
          grep -E "^(Test Suites|Tests|Snapshots|Time):" test-output.log | while IFS= read -r line; do
            echo "::notice title=Jest::${line}"
          done
          grep -E "^FAIL " test-output.log | while IFS= read -r line; do
            echo "::error title=Failed suite::${line}"
          done || true

  client-build:
    name: Client build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f server/web-static/index.html
          echo "✓ client bundle written to server/web-static"
